version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # TypeScript 7 is outside typescript-eslint 8.66.0's supported <6.1 range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Keep Node type definitions aligned with the Node.js 22 runtime used by CI.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
